services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Pulled from a .env file at the project root (gitignored).
        # Leave blank if you don't want OpenAI calls; the simulator will use a
        # deterministic mock instead.
        VITE_OPENAI_API_KEY: "${VITE_OPENAI_API_KEY:-}"
        VITE_OPENAI_MODEL:   "${VITE_OPENAI_MODEL:-gpt-4o-mini}"
    image: genesys-startup-studio:latest
    container_name: genesys-web
    restart: unless-stopped
    ports:
      # host:container — override via env: GENESIS_PORT=8027 docker compose up -d
      - "${GENESIS_PORT:-8026}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
