upstream genesys_auth {
    server auth:3000;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff2;

    # OAuth + shared-state API proxy. Only the actual backend endpoints are
    # proxied; everything else under /auth/* (notably /auth/success) is a SPA
    # route and must fall through to index.html below.
    location ~ ^/auth/(health|github(/callback)?)$ {
        proxy_pass http://genesys_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://genesys_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # /api/llm/responses runs OpenAI web_search per startup — each call
        # can take 10-25 s, so bump every relevant timeout well above default.
        proxy_connect_timeout 30s;
        proxy_send_timeout    240s;
        proxy_read_timeout    240s;
        proxy_buffering       off;
    }

    # Static assets — long cache
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — BrowserRouter routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
